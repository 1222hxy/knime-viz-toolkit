[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knime-viz-toolkit"
version = "0.1.0"
description = "Automatically read executed KNIME workflows (.knwf) and render publication-grade charts, with built-in AI Agent & MCP interfaces."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "knime-viz-toolkit contributors"}
]
keywords = ["knime", "visualization", "matplotlib", "data-science", "mcp", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pydantic>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
pandas = [
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
knime-viz = "knime_viz_toolkit.cli:main"
knime-viz-mcp = "knime_viz_toolkit.agent.mcp_server:main"

[project.urls]
Homepage = "https://github.com/1222hxy/knime-viz-toolkit"
Repository = "https://github.com/1222hxy/knime-viz-toolkit"
Issues = "https://github.com/1222hxy/knime-viz-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]
